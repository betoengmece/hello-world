    const values={
      body:tr(attack*8,flying?bob*4:0)+rot((heavy?.5:1.1)*beat+step*1.8-attack*4,115,180)+` translate(115 175) scale(${n(1+(heavy?.014:.007)*beat+attack*.035)} ${n(1-(heavy?.012:.006)*beat-attack*.025)}) translate(-115 -175)`,
      footLeft:tr(walk,Math.max(0,step)*-2.5),footRight:tr(-walk,Math.max(0,-step)*-2.5),
      handLeft:rot(-step*4+attack*22,62,130),handRight:rot(step*4-attack*30,166,130),
      arms:rot(-attack*12+step*3,115,120),head:rot(beat*.7-attack*5,115,105),
      curl:rot(beat*2,115,73),
      wingLeft:rot(Math.sin(f*(attack||ctx.flap?.9:.45))*(attack?28:20),96,112),
      wingRight:rot(-Math.sin(f*(attack||ctx.flap?.9:.45))*(attack?28:20),139,111),
      sting:rot(attack*16+beat*2,114,170),
      beeEyes:`translate(0 84) scale(1 ${blink?.1:1}) translate(0 -84)`,
      digLeft:tr(0,Math.sin(f*.08)*2.4-step*2-attack*5),
      digRight:tr(0,Math.sin(f*.08+2)*2.4+step*2-attack*7),
      digCenter:tr(0,Math.sin(f*.08+4)*2.7-attack*10),
      leafLeft:rot(beat*4-step*2+attack*7,116,65),leafRight:rot(-beat*4+step*2-attack*7,120,65),
      heads:rot(beat*1.5-step*2-attack*4,115,108)
    };
    const art=rig.svg.replace(/\{\{([^}]+)\}\}/g,(_,key)=>{
      if(key.startsWith('eyes')){const y=Number(key.slice(4));return `translate(0 ${y}) scale(1 ${blink?.08:1}) translate(0 ${-y})`;}
      return values[key]||'';
    });
    // Normaliza o conceito aos pés y=0 e escala do jogo; espelhamento fica no motor.
    return `<g transform="translate(0 ${n(bob)}) scale(${rig.scale}) translate(-115 ${-rig.ground})">${art}</g>`;
  }
  MS.AnimatedKanto={draw,selected:Object.fromEntries(Object.entries(rigs).map(([sp,r])=>[sp,r.version]))};
  if(MS.Art){const original=MS.Art.draw;MS.Art.draw=function(sp,c){return draw(sp,c)??original.call(this,sp,c);};}
})();

</script>
<script>
(()=>{
 const root=document.getElementById('kanto-animations');
 const mode=root.querySelector('#ka-mode'),play=root.querySelector('#ka-play');
 const stages=Array.from(root.querySelectorAll('[data-kanto-species]'));
 let running=!window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 let f=30,last=0,lastPaint=0,raf;
 const draw=window.MS.AnimatedKanto.draw;
 function render(){
  stages.forEach((stage,i)=>{
   const phase=f+i*23,walking=mode.value==='walk',attacking=mode.value==='attack';
   const breath=attacking?Math.max(0,18-(phase%100)):0;
   const ctx={f:phase,blink:(phase%230)<7,bob:Math.sin(phase*.08)*.7,step:walking?Math.sin(phase*.5)*1.6:0,x:0,breath,flap:walking};
   stage.innerHTML=draw(stage.getAttribute('data-kanto-species'),ctx);
  });
 }
 function updateLabel(){play.textContent=running?'Pausar':'Reproduzir';play.setAttribute('aria-pressed',String(running));root.querySelector('#ka-status').textContent='Cinco versões aprovadas · '+mode.options[mode.selectedIndex].text.toLowerCase()+(running?'':' · pausado');}
 function tick(now){
  if(!root.isConnected)return;
  if(last&&running)f+=Math.min(now-last,100)*.06;last=now;
  if(running&&now-lastPaint>=40){render();lastPaint=now;}
  raf=requestAnimationFrame(tick);
 }
 mode.addEventListener('change',()=>{f=30;render();updateLabel();});
 play.addEventListener('click',()=>{running=!running;last=0;updateLabel();});
 render();updateLabel();raf=requestAnimationFrame(tick);
})();
</script>
